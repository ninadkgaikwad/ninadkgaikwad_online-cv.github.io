career-profile:
  title: Career Profile
  summary: |
    Power and energy systems researcher and engineer specializing in intelligent buildings, optimization and control, and machine learning. Research focuses on scalable modeling and estimation of building thermal dynamics, building-grid simulation and co-simulation, and intelligent control of networked buildings for grid-edge applications. Additional work spans residential energy resiliency, home and community energy management, AC optimal power flow, distribution-grid analytics, renewable-energy forecasting, and data-driven modeling of energy systems.

