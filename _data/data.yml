projects:
  title: Projects
  intro: |
    Selected research and academic projects spanning power and energy systems, intelligent buildings, optimization and control, machine learning, renewable-energy forecasting, and energy resiliency.
  assignments:
  - title: Framework for Modeling and Control of Networked Buildings
    link: https://github.com/ninadkgaikwad/IntelligentControlOfNetworkedBuildings
    tagline: PhD research integrating control-oriented building thermal models; optimization- and Bayesian-inference-based estimation; black-box and scientific-machine-learning methods; scalable building simulation and data workflows; building-grid co-simulation; and intelligent control for grid-edge applications.
    place: WSU, Pullman
    time: Jan 2022 - Present
  - title: Intelligent Control of Residential Energy Systems / SmartCommunitySim
    link: https://github.com/ninadkgaikwad/SmartCommunitySim
    tagline: MS Computer Science research developing a scalable residential-community simulation and benchmarking framework for baseline, rule-based, model-predictive-control, and reinforcement-learning controllers under on-grid and off-grid operation with heterogeneous distributed energy resources. This work extends the home-energy-resiliency research initiated at the University of Florida.
    place: WSU, Pullman
    time: Jan 2024 - Present
  - title: Power Systems Analysis Toolbox (PowerEdu.jl)
    link: https://github.com/ninadkgaikwad/PowerEdu
    tagline: Julia-based power-systems analysis package developed from WSU coursework, with capabilities spanning Newton-Raphson power flow, continuation power flow, static state estimation, optimization, and ongoing power-system stability and transient simulation.
    place: WSU, Pullman
    time: Aug 2022 - Present
  - title: Power-System Control Algorithm Vulnerability Analysis using Network Science
    link: https://github.com/ninadkgaikwad/22_NetworkScience_Project
    tagline: Developed a modular Python power-system transient simulator with closed-loop control and communication capabilities, and evaluated degree centrality, PageRank, and eigenvalue-based analysis for identifying nodes critical to distributed frequency-control performance.
    place: WSU, Pullman
    time: Jan 2022 - Apr 2022
  - title: Home Energy Resiliency
    link: https://github.com/ninadkgaikwad/EnergyResiliency_SmartCommunity_MPC_RL
    tagline: Developed model-predictive-control and reinforcement-learning methods for residential energy resiliency using rooftop PV, battery storage, controllable loads, and related home-energy resources. This research became the foundation for the later WSU MS Computer Science work on intelligent residential energy systems and community-scale simulation and control.
    place: UFL, Gainesville
    time: Jan 2019 - Dec 2021
  - title: GAN and VAE for MNIST
    link: https://github.com/ninadkgaikwad/GAN_VAE_Project
    tagline: Implemented dense- and CNN-based Generative Adversarial Networks and Variational Autoencoders in TensorFlow for handwritten-digit generation.
    place: UFL, Gainesville
    time: Aug 2020 - Dec 2020
  - title: 'Optimal Control: Indirect and Direct Numerical Methods'
    link: https://github.com/ninadkgaikwad/OptimalControl_Project
    tagline: Implemented indirect Hamiltonian-boundary-value and direct collocation formulations for optimal-control problems in MATLAB, including nonlinear programming solved using IPOPT.
    place: UFL, Gainesville
    time: Aug 2019 - Dec 2019
  - title: State-Feedback Set-Point Tracking Control
    link: https://github.com/ninadkgaikwad/LQR_Project
    tagline: Performed simulation-based system identification and designed a Linear Quadratic Regulator for set-point tracking using an estimated state-space model.
    place: UFL, Gainesville
    time: Jan 2019 - Apr 2019
  - title: ARMA Time-Series Modeling for Solar PV Forecasting
    link: https://github.com/ninadkgaikwad/ARMA_TimeSeries_Forecasting_Project
    tagline: Developed ARMA forecasting models using least-squares and maximum-likelihood estimation and studied model order, training-data volume, and prediction timescale using real solar-generation data.
    place: UFL, Gainesville
    time: Aug 2018 - Dec 2018
  - title: Data Fault Detection
    link: https://github.com/ninadkgaikwad/DataFault_Detection
    tagline: Developed data-fault-detection algorithms for real building data collected using Raspberry-Pi-based sensors in collaboration with Dr. Anupama Kowli. Implemented SVM, ANN, wavelet, PCA, and hybrid PCA-wavelet methods in MATLAB using a modular software structure.
    place: IIT-B, Mumbai
    time: Aug 2017 - Oct 2017
  - title: Forecasting of Solar & Wind Energy
    link: https://github.com/ninadkgaikwad/SWEEFA_Development
    tagline: MTech thesis project developing the Solar & Wind Energy Estimation and Forecasting Application (SWEEFA), a MATLAB GUI-based platform for plant-level solar and wind energy estimation, weather and generation-data preprocessing, ANN- and ARIMA-based forecasting, and automated WRF forecasting using Bash scripts on a four-node Raspberry Pi 2 cluster.
    place: SPCE, Mumbai
    time: Aug 2015 - Jun 2016
  - title: DTC Control of DFIG
    link: https://github.com/ninadkgaikwad/DFIG_Control_Simulations
    tagline: Studied an ANN-based direct-torque-control strategy for a doubly fed induction generator, reproduced the method in SimPowerSystems/MATLAB, prepared an IEEE-style technical report, and presented the work as a departmental seminar.
    place: SPCE, Mumbai
    time: Jan 2015 - Apr 2015
  - title: Vector Control of DFIG
    link: https://github.com/ninadkgaikwad/DFIG_Control_Simulations
    tagline: Studied a vector-control strategy for a doubly fed induction generator, reproduced the method in SimPowerSystems/MATLAB, prepared an IEEE-style technical report, and presented the work as a departmental seminar.
    place: SPCE, Mumbai
    time: Aug 2014 - Dec 2014
  - title: Reactive Power Capability of Distributed Energy Systems
    link: https://github.com/ninadkgaikwad
    tagline: 'Team project evaluating reactive-power support from DFIGs, solar inverters, and diesel generators. Led the DFIG component, interpreted IEEE research literature, and contributed to the technical report and presentation. Grade: A.'
    place: UOW, Wollongong
    time: Feb 2014 - Jun 2014
  - title: Application of Vacuum Tubes in Sound Engineering and High-Frequency Amplification
    link: https://github.com/ninadkgaikwad
    tagline: 'Final-year team project examining contemporary vacuum-tube devices and their potential applications in sound engineering and high-frequency amplification, with emphasis on technical-literature analysis, engineering reporting, and collaborative project work. Grade: A.'
    place: VJTI, Mumbai
    time: Aug 2011 - Jun 2012
